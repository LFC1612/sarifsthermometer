<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#e8eefc">
<title>Sarif’s Thermometer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{
  --h:150; --ink:#1d2433; --soft:#4a5468;
  --bg:hsl(var(--h) 70% 93%); --card:hsl(var(--h) 60% 98%); --fill:hsl(var(--h) 75% 52%); --tube:hsl(var(--h) 30% 84%);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--ink:#eef1f8;--soft:#aab3c5;--bg:hsl(var(--h) 35% 11%);--card:hsl(var(--h) 25% 17%);--fill:hsl(var(--h) 70% 58%);--tube:hsl(var(--h) 20% 26%);}
}
:root[data-theme="dark"]{--ink:#eef1f8;--soft:#aab3c5;--bg:hsl(var(--h) 35% 11%);--card:hsl(var(--h) 25% 17%);--fill:hsl(var(--h) 70% 58%);--tube:hsl(var(--h) 20% 26%);}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);transition:background .5s}
body{font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45;-webkit-tap-highlight-color:transparent}
main{max-width:480px;margin:0 auto;padding:28px 20px 40px}
h1{font-size:2rem;line-height:1.1;font-weight:800;margin:0 0 6px;letter-spacing:-.02em}
.sub{color:var(--soft);margin:0 0 22px}
.stage{display:flex;gap:22px;align-items:stretch;justify-content:center;margin-bottom:22px}
.therm{position:relative;width:96px;height:340px;flex:none;touch-action:none;cursor:ns-resize;outline-offset:6px}
.tube{position:absolute;left:20px;width:56px;top:0;height:270px;border-radius:28px 28px 0 0;background:var(--tube);overflow:hidden}
.fill{position:absolute;left:0;right:0;bottom:0;background:var(--fill);transition:height .35s cubic-bezier(.3,1.3,.5,1),background .5s}
.bulb{position:absolute;left:4px;bottom:0;width:88px;height:88px;border-radius:50%;background:var(--fill);border:6px solid var(--bg);transition:background .5s}
.ticks{display:flex;flex-direction:column;justify-content:space-between;height:270px;padding:0;margin:0;list-style:none}
.ticks button{font:inherit;color:var(--soft);background:none;border:0;padding:6px 4px;text-align:left;cursor:pointer;font-size:1rem}
.ticks button[aria-pressed="true"]{color:var(--ink);font-weight:800}
.ticks button:focus-visible{outline:2px solid var(--fill);border-radius:6px}
.card{background:var(--card);border-radius:20px;padding:18px 18px 16px;margin-bottom:14px}
.phrase{font-size:1.3rem;font-weight:600;line-height:1.3;margin:0}
.card h2{font-size:1rem;margin:0 0 10px}
.card ul{margin:0;padding-left:20px}
.card li{margin-bottom:8px}
.hint{color:var(--soft);font-size:.95rem;text-align:center;margin:-8px 0 18px}
.save{width:100%;font:inherit;font-weight:800;font-size:1.05rem;border:0;border-radius:16px;padding:15px;background:var(--ink);color:var(--bg);cursor:pointer}
.save:focus-visible{outline:3px solid var(--fill);outline-offset:3px}
.save:active{transform:scale(.98)}
.week{display:flex;justify-content:space-between;margin-top:6px}
.day{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.8rem;color:var(--soft)}
.dot{width:26px;height:26px;border-radius:50%;background:var(--tube)}
.msg{text-align:center;color:var(--soft);min-height:1.4em;margin:10px 0 18px}
.date{font-weight:600;color:var(--soft);margin:0 0 6px}
.wonder{font-size:1.15rem;font-weight:600;text-align:center;margin:0;padding:6px 4px}
#result[hidden]{display:none}
.brand{display:flex;align-items:center;gap:12px;margin:0 0 16px}
.brand svg{width:52px;height:52px;flex:none}
.brand b{display:block;font-size:1.7rem;font-weight:800;line-height:1;letter-spacing:-.03em}
.brand span{display:block;font-size:.95rem;font-weight:600;color:var(--soft);margin-top:3px;letter-spacing:.06em}
.card.mimo{background:hsl(335 85% 92%)}
.card.mimo .wonder{color:hsl(335 70% 34%)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .card.mimo{background:hsl(335 38% 24%)}:root:not([data-theme="light"]) .card.mimo .wonder{color:hsl(335 90% 85%)}}
:root[data-theme="dark"] .card.mimo{background:hsl(335 38% 24%)}
:root[data-theme="dark"] .card.mimo .wonder{color:hsl(335 90% 85%)}
.mrow{display:flex;align-items:center;gap:10px}
.mrow .wonder{flex:1;min-height:4.4em;display:flex;align-items:center;justify-content:center}
.more{flex:none;width:44px;height:44px;display:grid;place-items:center;border:0;border-radius:50%;padding:0;background:hsl(335 70% 34%);color:#fff;cursor:pointer}
.more svg{width:22px;height:22px}
.more:active{transform:scale(.92)}
.more:focus-visible{outline:3px solid var(--fill);outline-offset:2px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .more{background:hsl(335 90% 85%);color:#2a1020}}
:root[data-theme="dark"] .more{background:hsl(335 90% 85%);color:#2a1020}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <div class="brand" role="img" aria-label="Sarif’s Thermometer">
    <svg viewBox="0 0 48 48" aria-hidden="true"><rect width="48" height="48" rx="15" fill="var(--ink)"/><rect x="20.5" y="8" width="7" height="24" rx="3.5" fill="var(--bg)"/><circle cx="24" cy="35" r="7" fill="var(--bg)"/><rect x="22.6" y="19" width="2.8" height="16" rx="1.4" fill="var(--fill)"/><circle cx="24" cy="35" r="4" fill="var(--fill)"/><path d="M31 13h4M31 18h3M31 23h4" stroke="var(--bg)" stroke-width="2" stroke-linecap="round"/></svg>
    <div><b>Sarif’s</b><span>Thermometer</span></div>
  </div>
  <p class="date" id="date"></p>
  <h1>¿Cómo has dormido hoy?</h1>
  <p class="sub">Mueve el termómetro hasta tu nivel de descanso.</p>

  <div class="stage">
    <div class="therm" id="therm" role="slider" tabindex="0" aria-label="Calidad del sueño" aria-valuemin="0" aria-valuemax="4" aria-valuenow="2" aria-valuetext="Regular">
      <div class="tube"><div class="fill" id="fill"></div></div>
      <div class="bulb"></div>
    </div>
    <ul class="ticks" id="ticks"></ul>
  </div>
  <p class="hint" id="hint">Arrastra o toca una opción</p>

  <div id="result" hidden>
    <div class="card"><p class="phrase" id="phrase"></p></div>
    <div class="card mimo"><h2>Un mimo para hoy</h2><div class="mrow"><p class="wonder" id="wonder"></p><button class="more" id="more" type="button" aria-label="Siguiente mimo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div></div>
    <div class="card"><h2>Para dormir mejor esta noche</h2><ul id="tips"></ul></div>

    <button class="save" id="save" type="button">Guardar el día de hoy</button>
    <p class="msg" id="msg" role="status"></p>
  </div>

  <div class="card"><h2>Tu última semana</h2><div class="week" id="week"></div></div>
</main>

<script>
var LEVELS=[
 {n:"Fatal",h:225,p:"Una mala noche no define tu día. Hoy ve despacio y sé amable contigo: ya lo estás haciendo bien solo por seguir adelante.",
  t:["Sal a la calle 10 minutos por la mañana: la luz natural reinicia tu reloj interno.","Toma el último café antes de las 14:00.","Si necesitas una siesta, que sea de 20 minutos y antes de las 16:00."]},
 {n:"Mal",h:200,p:"No ha sido tu mejor noche, pero fijarte en ello ya es el primer paso. Mañana tienes otra oportunidad.",
  t:["Acuéstate y levántate a la misma hora, también el fin de semana.","Deja las pantallas una hora antes de dormir.","Cena ligero y con al menos dos horas de margen antes de acostarte."]},
 {n:"Regular",h:150,p:"Ni fu ni fa. Con un par de pequeños ajustes puedes darle un buen empujón a tus noches.",
  t:["Mantén la habitación oscura y fresca, alrededor de 18–20 °C.","Haz un ritual de 10 minutos: ducha tibia, lectura o estiramientos suaves.","Apunta en un papel lo que te preocupa para dejarlo fuera de la cama."]},
 {n:"Bien",h:45,p:"¡Buen descanso! Tu cuerpo te lo agradece. Sigue con lo que estás haciendo, funciona.",
  t:["Mantén tu horario de sueño, es tu mejor aliado.","Busca luz natural por la mañana para fijar el ritmo.","Haz ejercicio durante el día, pero no justo antes de acostarte."]},
 {n:"Genial",h:22,p:"¡Qué energía! Hoy tienes el día a tu favor. Aprovéchalo para lo que más te importa.",
  t:["Anota qué hiciste ayer antes de dormir para repetirlo.","Mantén la rutina: la constancia es lo que sostiene un buen sueño.","Comparte tu truco con alguien que duerma mal."]}
];
var PH=[
 ["Hoy toca ir en modo ahorro de energía, y está totalmente permitido.","Dormir mal un día no borra todo lo bueno que ya has hecho.","Respira hondo: hoy basta con hacer lo justo y hacerlo con cariño.","Eres más fuerte que una mala noche. Y hoy te mereces un buen abrazo.","Hoy no hace falta brillar. Con ser tú, ya sobra.","Tu cuerpo te pide descanso: escúchalo sin sentirte culpable."],
 ["Cada noche es un borrador; la de hoy puede salir mejor.","Hoy te regalas un café con calma y una sonrisa, aunque cueste.","No necesitas un día perfecto, solo uno que puedas disfrutar un poquito.","Eres un trocito de luz aunque hoy estés un poco apagado.","Mereces dormir bien y se te va a dar: paso a paso.","Pequeños pasos, grandes sonrisas. Empieza por el primero."],
 ["Un día normal también puede convertirse en un día bonito.","Estás en el punto medio: perfecto para elegir tu propio rumbo.","Un paseo y un vaso de agua pueden cambiarte el día.","Tienes un día entero por delante para hacerlo especial.","Eres suficiente tal y como eres, hayas dormido como hayas dormido.","A veces lo mejor es lo sencillo: una canción, un abrazo y buena compañía."],
 ["Descansar bien es una forma de quererte. ¡Sigue así!","Hoy vas con buen viento: aprovecha para hacer algo que te haga ilusión.","Una buena noche, un buen día. Así de sencillo.","Hay días que empiezan bien, y este es uno de ellos.","Eres de esas personas que mejoran el día de los demás. Y hoy se nota.","Brilla un poquito más hoy, que te toca."],
 ["Hoy vas a comerte el mundo, pero con calma y una sonrisa.","Cuando descansas así, todo se ve más bonito. ¡Disfrútalo!","Energía al máximo: contagia tu sonrisa a quien te cruces.","Hoy el mundo es tuyo. Y si no, te lo ganas con tu sonrisa.","Eres un rayito de sol con patas. Hoy más que nunca.","Un día genial empieza con una noche genial. ¡Lo has conseguido!"]
];
var TX=[
 ["Date una ducha tibia por la noche: baja la temperatura corporal y ayuda a dormir.","Respira cuatro segundos, aguanta cuatro y suelta en seis. Repite unas diez veces.","Evita el alcohol por la noche: parece que relaja, pero fragmenta el sueño."],
 ["Prueba a leer un rato en papel en lugar de mirar el móvil.","Ventila la habitación unos minutos antes de acostarte.","Si no te duermes en 20 minutos, levántate y haz algo tranquilo con poca luz."],
 ["Escucha sonidos suaves o una meditación guiada al acostarte.","Baja las luces de casa una hora antes de dormir.","Haz tres estiramientos suaves de cuello y hombros antes de meterte en la cama."],
 ["Cena a una hora parecida cada día para ayudar a tu reloj interno.","Deja el móvil lejos de la cama.","Agradece tres cosas del día antes de cerrar los ojos."],
 ["Aprovecha para hacer algo de ejercicio al aire libre.","Bebe agua durante el día: también ayuda a descansar mejor.","Prepara hoy lo de mañana para empezar la mañana con calma."]
];
var MW=["Eres la razón por la que alguien sonríe hoy, aunque no lo sepas.","Hoy es un buen día para ser un poquito más amable contigo.","Lo mejor está por llegar, y tú ya vas de camino.","Nunca subestimes el poder de una buena siesta y un buen abrazo.","Eres mucho más de lo que crees y mucho mejor de lo que piensas.","Pequeñas cosas, grandes sonrisas.","Sé tu propio rayo de sol.","Hoy toca quererte mucho.","Respira, sonríe y sigue siendo tú.","Cada día es una página nueva: escribe algo bonito.","No hace falta correr: lo bonito llega a su ritmo.","Eres el plan favorito de alguien.","Cuídate hoy como cuidarías a quien más quieres.","La vida es mejor con música, café y buena gente."];
function dayNum(){var n=new Date();return Math.floor(Date.UTC(n.getFullYear(),n.getMonth(),n.getDate())/864e5)}
var cur=2, touched=false, KEY="termometro-animo-v1";
var mi=dayNum()%MW.length;
var $=function(i){return document.getElementById(i)};
var therm=$("therm"), ticks=$("ticks");

LEVELS.slice().reverse().forEach(function(l,i){
  var li=document.createElement("li"), b=document.createElement("button");
  b.type="button"; b.textContent=l.n; b.dataset.l=4-i;
  b.addEventListener("click",function(){set(+b.dataset.l,true)});
  li.appendChild(b); ticks.appendChild(li);
});

function set(n,user){
  var prev=cur; cur=Math.max(0,Math.min(4,n));
  if(user&&cur!==prev){mi=(mi+1)%MW.length;}
  if(user){touched=true;$("hint").textContent="";$("result").hidden=false;}
  var L=LEVELS[cur];
  document.documentElement.style.setProperty("--h",L.h);
  $("fill").style.height=(8+cur*23)+"%";
  var D=dayNum(), pool=[L.p].concat(PH[cur]), tp=L.t.concat(TX[cur]), s=D%tp.length, tl="";
  $("phrase").textContent=pool[(D+cur)%pool.length];
  $("wonder").textContent=MW[mi];
  for(var k=0;k<3;k++){tl+="<li>"+tp[(s+k)%tp.length]+"</li>"}
  $("tips").innerHTML=tl;
  therm.setAttribute("aria-valuenow",cur); therm.setAttribute("aria-valuetext",L.n);
  Array.prototype.forEach.call(ticks.querySelectorAll("button"),function(b){b.setAttribute("aria-pressed",String(+b.dataset.l===cur))});
  var m=document.querySelector('meta[name="theme-color"]'); if(m)m.content="hsl("+L.h+",70%,93%)";
}

function fromY(y){
  var r=therm.getBoundingClientRect(), tubeH=270;
  var f=1-((y-r.top)/tubeH);
  set(Math.round(f*4),true);
}
var drag=false;
therm.addEventListener("pointerdown",function(e){drag=true;therm.setPointerCapture(e.pointerId);fromY(e.clientY)});
therm.addEventListener("pointermove",function(e){if(drag)fromY(e.clientY)});
therm.addEventListener("pointerup",function(){drag=false});
therm.addEventListener("pointercancel",function(){drag=false});
therm.addEventListener("keydown",function(e){
  if(e.key==="ArrowUp"||e.key==="ArrowRight"){set(cur+1,true);e.preventDefault()}
  if(e.key==="ArrowDown"||e.key==="ArrowLeft"){set(cur-1,true);e.preventDefault()}
});

function today(){var d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()}
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}}
function store(o){try{localStorage.setItem(KEY,JSON.stringify(o));return true}catch(e){return false}}

function renderWeek(){
  var data=load(), w=$("week"), names=["D","L","M","X","J","V","S"], out="";
  for(var i=6;i>=0;i--){
    var d=new Date(); d.setDate(d.getDate()-i);
    var k=d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(), v=data[k];
    var style=(v===undefined)?"":' style="background:hsl('+LEVELS[v].h+' 75% 52%)"';
    var label=(v===undefined)?"sin registro":LEVELS[v].n;
    out+='<div class="day"><div class="dot"'+style+' title="'+label+'" aria-label="'+names[d.getDay()]+': '+label+'"></div>'+names[d.getDay()]+'</div>';
  }
  w.innerHTML=out;
}

$("more").addEventListener("click",function(){mi=(mi+1)%MW.length;$("wonder").textContent=MW[mi];});
$("save").addEventListener("click",function(){
  var data=load(); data[today()]=cur;
  $("msg").textContent=store(data)?"Guardado. ¡Hasta mañana!":"No se ha podido guardar en este navegador.";
  renderWeek();
});

var data0=load(); if(data0[today()]!==undefined){cur=data0[today()]}
var ds=new Date().toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
$("date").textContent=ds.charAt(0).toUpperCase()+ds.slice(1);
set(cur,false); renderWeek();
</script>
<script data-goatcounter="https://lfcvisits.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</body>
</html>
